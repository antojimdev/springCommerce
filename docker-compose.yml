version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: spring_commerce_postgres
    environment:
      POSTGRES_DB: spring_commerce
      POSTGRES_USER: spring_user
      POSTGRES_PASSWORD: spring_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spring_commerce_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U spring_user" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # TODO: Configure backup strategy in PHASE 4
    # - Regular snapshots
    # - Point-in-time recovery
    # - High availability setup

  redis:
    image: redis:7-alpine
    container_name: spring_commerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - spring_commerce_network
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # TODO: Configure in PHASE 8
    # - Token revocation list
    # - Session management
    # - Cache strategy

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: spring_commerce_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - spring_commerce_network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # TODO: Configure in PHASE 10-13
    # - Exchanges
    # - Queues
    # - Routing keys
    # - Dead-letter queues
    # - Consumer acknowledgments

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring_commerce_app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spring_commerce
      SPRING_DATASOURCE_USERNAME: spring_user
      SPRING_DATASOURCE_PASSWORD: spring_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - spring_commerce_network
    # TODO: Add volume mounts for development
    # volumes:
    #   - ./api/src:/app/src
    #   - ./api/target:/app/target

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  spring_commerce_network:
    driver: bridge

# Usage:
# docker-compose up -d          # Start all services in background
# docker-compose logs -f app    # Follow app logs
# docker-compose down           # Stop and remove containers
# docker-compose down -v        # Stop and remove containers + volumes
