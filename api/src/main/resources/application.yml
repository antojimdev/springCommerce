spring:
  application:
    name: spring-commerce-api

  profiles:
    active: dev

  # Database Configuration (PostgreSQL)
  datasource:
    # TODO: Configure actual database URL in PHASE 4
    # Placeholder for learning: in PHASE 4, connect to PostgreSQL in docker-compose
    url: jdbc:postgresql://localhost:5432/spring_commerce
    username: spring_user
    password: spring_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # TODO: Change to 'validate' in production
      # PHASE 4: Understand Hibernate DDL strategies
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Redis Configuration
  data:
    redis:
      # TODO: Use Redis in PHASE 8 for token revocation
      host: localhost
      port: 6379
      timeout: 60000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # RabbitMQ Configuration
  rabbitmq:
    # TODO: Configure RabbitMQ in PHASE 10
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  # Security Configuration
  security:
    # TODO: JWT implementation in PHASE 7
    # Placeholder: configure JWT secret and expiration
    user:
      name: admin
      password: admin123

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# Logging Configuration
logging:
  level:
    root: INFO
    com.springcommerce: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.springcommerce: DEBUG
    org.springframework: DEBUG

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # TODO: Override in test classes with Testcontainers in PHASE 14
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

logging:
  level:
    com.springcommerce: DEBUG
